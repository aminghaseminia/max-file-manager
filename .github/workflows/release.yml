name: release

# هر تگ v* یک ریلیز کامل برای لینوکس، ویندوز و مک می‌سازد.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # نسخه در package.json تنها منبع است؛ تگ باید همان را داشته باشد
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          node -e 'const v=require("./package.json").version;
          const tag=process.env.GITHUB_REF_NAME.replace(/^v/,"");
          if(v!==tag){console.error("package.json "+v+" does not match tag "+tag);process.exit(1)}
          console.log("version "+v+" ok")'

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb
          - os: windows-latest
            platform: windows
            args: --win nsis
          # بدون امضا: کاربر مک باید بار اول راست‌کلیک → Open کند (docs/RELEASE.md)
          - os: macos-latest
            platform: mac
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          name: "Max File Manager ${{ github.ref_name }} — Linux Edition"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
