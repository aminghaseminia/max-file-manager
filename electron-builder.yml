appId: tech.performai.maxfilemanager
productName: Max File Manager
directories:
  output: release
files:
  - out/**/*
  - package.json
# نام ثابت و بدون فاصله برای فایل‌های ریلیز (ویندوز/مک/لینوکس)
artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: FileManager
  synopsis: Dual-pane file manager
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # امضای ad-hoc (نه null) تا بیلد arm64 روی مک اصلاً اجرا شود؛ Gatekeeper هنوز هشدار می‌دهد
  identity: '-'
  hardenedRuntime: false
  notarize: false
  # macOS has no "default file manager" switch; claiming public.folder is the closest native option
  # (Finder keeps the desktop and Reveal in Finder, so this is not a Finder replacement)
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
