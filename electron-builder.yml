appId: tech.performai.maxfilemanager
productName: Max File Manager
directories:
  output: release
files:
  - out/**/*
  - package.json
  # dbus-next's Windows-only transport (usocket) is never used: the XDG portal is Linux-only,
  # and it drags a build-time node-gyp/request/tar chain we do not want in the artifact
  - "!**/node_modules/usocket/**"
extraResources:
  - from: build/icon.png
    to: icon.png
# نام ثابت و بدون فاصله برای فایل‌های ریلیز (ویندوز/مک/لینوکس)
artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: FileManager
  synopsis: Dual-pane file manager
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  # امضای ad-hoc (نه null) تا بیلد arm64 روی مک اصلاً اجرا شود؛ Gatekeeper هنوز هشدار می‌دهد
  identity: '-'
  hardenedRuntime: false
  notarize: false
